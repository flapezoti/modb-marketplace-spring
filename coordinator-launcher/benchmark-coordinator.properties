# Coordinator settings for the performance benchmark (Claude outputs/vmodb-performance-benchmark-plan.md).
# Copied verbatim from the original implementation's proxy app.properties
# (work/modb-original-marketplace/proxy/src/main/resources/app.properties), coordinator keys only,
# so both coordinators run with identical settings (plan decision 2). VMS hosts/ports are not here:
# CoordinatorMain takes them from system properties, as before.

tcp_port=8091
network_thread_pool_size=8
network_buffer_size=0
so_buffer_size=0
network_send_timeout=0
batch_window_ms=500
num_max_transactions_batch=10000
num_vms_workers=1
num_queues_vms_worker=1
num_transaction_workers=1
max_sleep=0
logging=true
logging_type=default
