# NOTE: ConfigUtils loads a single, classloader-wide app.properties (see ConfigUtils'
# static initializer) -- product.Main, cart.Main and this test's own coordinator setup
# all read from THIS file, not from product/cart's own src/main/resources/app.properties.

# coordinator
tcp_port=8091
product_host=localhost
cart_host=localhost
batch_window_ms=500
num_max_transactions_batch=10000
num_transaction_workers=1
num_queues_vms_worker=1

# shared network options (coordinator + both VMSes)
network_thread_pool_size=4
network_buffer_size=0
so_buffer_size=0
network_send_timeout=0

# VMS-side (product.Main / cart.Main)
vms_thread_pool_size=4
num_vms_workers=1
max_sleep=0
logging=false
checkpointing=false
max_records=0
